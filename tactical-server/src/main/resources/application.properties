spring.application.name=tactical-orchestration
server.address=127.0.0.1
server.port=8080
server.max-http-request-header-size=8KB
server.tomcat.max-swallow-size=64KB
server.tomcat.connection-timeout=10s
server.tomcat.threads.max=32
server.tomcat.max-connections=64
server.error.include-message=never
server.error.include-stacktrace=never
spring.servlet.multipart.enabled=false
spring.mvc.log-request-details=false
tactical.token-file=${TACTICAL_TOKEN_FILE:.runtime/session.token}
tactical.max-request-bytes=65536

springdoc.api-docs.path=/api/v1/openapi
springdoc.api-docs.version=OPENAPI_3_1
springdoc.override-with-generic-response=false
